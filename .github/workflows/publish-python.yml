name: Publish Python SDK

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: packages/python
        run: pip install -e ".[all]" "ruff>=0.4,<0.5" "pytest>=8.0,<9.0" "pytest-asyncio>=0.23,<0.24" pyyaml

      - name: Lint
        working-directory: packages/python
        run: ruff check ag_guardrail/

      - name: Test
        working-directory: packages/python
        run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pip install poetry

      - name: Build
        working-directory: packages/python
        run: poetry build

      # The test job installs [all] extras, which hide missing base dependencies.
      - name: Install check
        working-directory: packages/python
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import ag_guardrail; print(ag_guardrail.__version__)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
