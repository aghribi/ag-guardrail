[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ag-guardrail"
version = "0.6.0"
description = "Runtime safety proxy for LLM applications"
authors = ["Adnan Ghribi <aghribi@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/aghribi/ag-guardrail"
repository = "https://github.com/aghribi/ag-guardrail"
packages = [{ include = "ag_guardrail" }]

[tool.poetry.dependencies]
python   = "^3.10"
pydantic = "^2.0"
httpx = ">=0.27,<1"
pyyaml   = "^6.0"

[tool.poetry.extras]
openai    = ["openai"]
anthropic = ["anthropic"]
all       = ["openai", "anthropic"]

[tool.poetry.dependencies.openai]
version  = ">=1.55.3,<2"
optional = true

[tool.poetry.dependencies.anthropic]
version  = ">=0.40,<3"
optional = true

[tool.poetry.group.dev.dependencies]
pytest         = "^8.0"
pytest-asyncio = "^0.23"
ruff           = "^0.4"
openai         = ">=1.55.3,<2"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
